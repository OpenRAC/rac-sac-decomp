# ByteMatch progress report (https://bytematch.dev/OpenRAC/rac-sac-decomp).
#
# ByteMatch reads objdiff's report.json from an artifact named
# "<VERSION>_report", from successful push runs on the default branch.
# This job does NOT build the game: the toolchains and retail executables
# cannot be redistributed. The report is generated locally and committed
# as progress/report.json; this job only proves it is current, validates
# it, and uploads it. It holds names, addresses, sizes and percentages --
# no retail bytes.
#
# The repository must be registered once on https://bytematch.dev
# (sign in with GitHub, Manage, Add project).
name: Progress report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the committed report is current
        run: python3 tools/gen_progress_report.py --check

      - name: Validate the reports with objdiff
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
          echo "c8290281e82114bcc1a06ff73061110d3902a177822e750337de2537188e358f  $RUNNER_TEMP/objdiff-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/objdiff-cli"
          for r in progress/report.json progress/pal/report.json; do
            "$RUNNER_TEMP/objdiff-cli" report changes "$r" "$r" -o "$RUNNER_TEMP/validation.json"
          done

      - name: Summarise
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          for version, path in (("SCUS_976.23 (USA)", "progress/report.json"),
                                ("SCES_554.96 (Europe)", "progress/pal/report.json")):
              m = json.load(open(path))["measures"]
              print("%s: %.2f%% code, %s / %s functions  " % (version, m["matched_code_percent"],
                                                            m["matched_functions"], m["total_functions"]))
          print()
          r = json.load(open("progress/report.json"))
          m = r["measures"]
          print("| Measure | Value |")
          print("| --- | --- |")
          print("| Code matched | %.2f%% (%s / %s bytes) |"
                % (m["matched_code_percent"], m["matched_code"], m["total_code"]))
          print("| Functions matched | %s / %s |" % (m["matched_functions"], m["total_functions"]))
          print("| Units complete | %s / %s |" % (m.get("complete_units", 0), m.get("total_units", 0)))
          for c in r.get("categories", []):
              cm = c["measures"]
              print("| %s | %.2f%% code, %s functions |"
                    % (c["name"], cm["matched_code_percent"], cm["matched_functions"]))
          PY

      - name: Upload the USA progress report
        uses: actions/upload-artifact@v4
        with:
          name: SCUS_976.23_report
          path: |
            progress/report.json
            progress/functional.json
          if-no-files-found: error

      - name: Upload the Europe progress report
        uses: actions/upload-artifact@v4
        with:
          name: SCES_554.96_report
          path: progress/pal/report.json
          if-no-files-found: error
